<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="뉴질랜드 남섬과 시드니 15일 여행 일정표 — 경로 지도, 날짜별 일정, 주변 맛집, 예약 현황.">
<meta name="theme-color" content="#FBFAF5">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="남섬 &amp; 시드니 여행">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%22.9em%22%20font-size%3D%2290%22%3E%F0%9F%9A%90%3C%2Ftext%3E%3C%2Fsvg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%22.9em%22%20font-size%3D%2290%22%3E%F0%9F%9A%90%3C%2Ftext%3E%3C%2Fsvg%3E">
<title>남섬 &amp; 시드니 여행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img,svg,video{display:block;max-width:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
textarea{resize:vertical}
a{color:inherit}
</style>
</head>
<body>
<style>
:root{
  --bg:#FBFAF5; --surface:#FFFFFF; --surface2:#F5F2EA; --line:#EAE5DA; --line2:#CFC8B8;
  --ink:#232018; --ink2:#6E6659; --ink3:#A69D8D;
  --acc:#D4852A; --acc-soft:#FDF0DC; --acc-ink:#A5601A;
  --teal:#128FA0; --teal-soft:#DCF2F5;
  --cab:#F2EDE2; --cab2:#FFFFFF; --cab-line:#E6DFD0; --cab-ink:#2B251C; --cab-ink2:#8C8271;
  --rim-hi:rgba(255,255,255,.7); --rim-vig:rgba(70,58,40,.28); --mirror:#E6DFD1;
  --r:14px; --sh:0 1px 2px rgba(60,52,38,.04),0 8px 22px -18px rgba(60,52,38,.32);
  --m-sea:#DAEFF8; --m-sea2:#C2E3F0; --m-land:#EAF6D8; --m-land2:#CFE8B4;
  --m-coast:#8FB47C; --m-lake:#6FD2E2; --m-mtn:#B9C4AE; --m-snow:#FFFFFF; --m-ink:#3A4B32;
  --fd:"Jua",sans-serif; --fe:"Fredoka",sans-serif;
  --fb:"IBM Plex Sans KR",system-ui,sans-serif; --fm:"JetBrains Mono",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-family:var(--fd);font-weight:400;letter-spacing:-.01em;line-height:1.25}
p{margin:0}
a{color:var(--acc-ink)}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input{font-family:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:5px}
.wrap{max-width:1060px;margin:0 auto;padding:0 18px}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}

/* ── windshield ── */
.cabin{background:var(--cab);position:relative}
.cabin-in{max-width:1060px;margin:0 auto;padding:14px 18px 0}
.glass{position:relative;border-radius:26px;overflow:hidden;aspect-ratio:2.5/1;background:#0D1418}
.glass svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.glass .rim{position:absolute;inset:0;border-radius:26px;pointer-events:none;
  box-shadow:inset 0 0 0 10px var(--cab),inset 0 3px 0 11px var(--rim-hi),inset 0 -34px 48px -28px var(--rim-vig)}
@media(max-width:760px){.cabin-in{padding:12px 12px 0}.glass{aspect-ratio:3/2;border-radius:20px}
  .glass .rim{border-radius:20px;box-shadow:inset 0 0 0 7px var(--cab),inset 0 2px 0 8px var(--rim-hi),inset 0 -28px 40px -24px var(--rim-vig)}}
.tagday{position:absolute;left:18px;top:16px;font-family:var(--fm);font-size:.66rem;letter-spacing:.16em;color:#fff;
  background:rgba(20,16,12,.5);backdrop-filter:blur(6px);padding:5px 11px;border-radius:30px}
.mirror{position:absolute;left:50%;top:7px;transform:translateX(-50%);width:104px;height:22px;border-radius:8px;
  background:var(--mirror);display:grid;place-items:center;z-index:3}
.mirror i{display:block;width:92px;height:13px;border-radius:4px;background:linear-gradient(#5E7F8C,#7FA0A8)}
@media(max-width:760px){.mirror{width:84px;height:18px}.mirror i{width:74px;height:11px}}

/* dashboard */
.dash{display:flex;gap:9px;padding:12px 0 16px;align-items:stretch}
.dg{flex:1;min-width:0;background:var(--cab2);border:1px solid var(--cab-line);border-radius:13px;padding:9px 12px;box-shadow:var(--sh)}
.dg .l{font-family:var(--fm);font-size:.55rem;letter-spacing:.16em;color:var(--cab-ink2)}
.dg .v{font-family:var(--fd);font-size:1.22rem;color:var(--cab-ink);line-height:1.25;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dg .u{font-size:.66rem;color:var(--cab-ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dg.wide{flex:1.8}
@media(max-width:620px){.dash{flex-wrap:wrap}.dg{flex:1 1 44%}.dg.wide{flex:1 1 100%;order:-1}}

/* fx strip */
.fx{display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:9px 12px;margin:14px 0 0;font-family:var(--fm);font-size:.8rem}
.fx .k{color:var(--ink3);font-size:.64rem;letter-spacing:.12em}
.fx b{font-weight:600}
.fx input{width:84px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;color:var(--ink);font-family:var(--fm);font-size:.8rem}
.fx input::-webkit-outer-spin-button,.fx input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.fx .seg{display:inline-flex;background:var(--surface2);border-radius:8px;padding:2px}
.fx .seg button{border:0;background:none;padding:4px 9px;border-radius:6px;font-family:var(--fm);font-size:.72rem;color:var(--ink2)}
.fx .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
.fx .edit{border:1px solid var(--line);background:var(--surface2);border-radius:20px;padding:4px 10px;font-size:.68rem;color:var(--ink3);text-decoration:none}
.fx .edit:hover{color:var(--ink);border-color:var(--line2)}
.fx .stamp{margin-left:auto;font-size:.68rem;color:var(--ink3)}
.fx .stamp.stale{color:var(--acc-ink);font-weight:600}
.pay{display:inline-block;padding:2px 7px;border-radius:20px;font-size:.68rem;white-space:nowrap}
.pay.ok{background:var(--surface2);color:var(--ink3)}
.pay.due{background:var(--acc-soft);color:var(--acc-ink);font-weight:600}
.sheet{display:block;margin-top:10px;padding:11px 14px;background:var(--acc-soft);border:1px solid var(--acc);
  border-radius:var(--r);color:var(--acc-ink);text-decoration:none;font-size:.82rem;font-weight:600}
.sheet:hover{background:var(--acc);color:#fff}
.fx .edit[hidden]{display:none}
.fx #fxsync.busy{opacity:.5;pointer-events:none}
.fxedit{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);
  border-top:0;border-radius:0 0 12px 12px;padding:10px 12px;font-family:var(--fm);font-size:.76rem;margin-top:-1px}
.fxedit[hidden]{display:none}
.fxedit label{color:var(--ink3);font-size:.68rem}
.fxedit input{width:92px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:5px 9px;color:var(--ink);font-family:var(--fm);font-size:.78rem}
.fxedit input::-webkit-outer-spin-button,.fxedit input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.fxedit .save{border:0;background:var(--acc);color:#fff;border-radius:20px;padding:5px 14px;font-size:.72rem;font-weight:600}
.fxedit .edit{border:1px solid var(--line);background:var(--surface2);border-radius:20px;padding:4px 10px;font-size:.7rem;color:var(--ink3)}

/* nav */
.nav{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin-top:18px}
.nav-in{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none}
.nav-in::-webkit-scrollbar{display:none}
.nav a{padding:13px 0;color:var(--ink3);font-size:.9rem;text-decoration:none;white-space:nowrap;border-bottom:2px solid transparent}
.nav a.on{color:var(--ink);border-bottom-color:var(--acc)}

section{padding:26px 0 44px}
h2{font-size:1.2rem;margin-bottom:14px}

/* day rail */
.rail{display:flex;gap:7px;overflow-x:auto;padding:3px 3px 12px;scroll-snap-type:x proximity}
.dc{flex:0 0 auto;width:116px;text-align:left;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:9px 11px 10px;display:flex;flex-direction:column;gap:2px}
.dc:hover{border-color:var(--line2)}
.dc[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.dc .n{font-family:var(--fm);font-size:.62rem;color:var(--ink3);letter-spacing:.1em}
.dc .d{font-family:var(--fm);font-weight:600;font-size:.9rem;letter-spacing:-.03em}
.dc .t{font-size:.73rem;color:var(--ink2);line-height:1.35}
.dc .bar{height:3px;border-radius:2px;width:22px;margin-top:3px;background:var(--teal)}
.dc.au .bar{background:var(--acc)}

/* schedule */
.sched{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--sh)}
.sh{padding:16px 18px 14px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.sh h3{font-size:1.3rem}
.sh .meta{font-family:var(--fm);font-size:.74rem;color:var(--ink3)}
.sh .nv{margin-left:auto;display:flex;gap:6px}
.sh .nv button{background:var(--surface2);border:1px solid var(--line);border-radius:9px;width:32px;height:32px;display:grid;place-items:center;color:var(--ink2)}
.sh .nv button:disabled{opacity:.3;cursor:default}
.row{display:grid;grid-template-columns:76px 1fr;gap:13px;padding:13px 18px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface2)}
.row .tm{font-family:var(--fm);font-size:.77rem;font-weight:600;color:var(--acc-ink);padding-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.row .ti{font-size:.96rem;font-weight:500;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.row .de{font-size:.82rem;color:var(--ink2);margin-top:3px}
.row .me{font-size:.81rem;color:var(--ink2);margin-top:7px;padding:8px 11px;background:var(--surface2);border-radius:9px}
.row .me.w{background:var(--acc-soft);color:var(--ink)}
.row a.ml{font-family:var(--fm);font-size:.7rem;color:var(--ink3);text-decoration:none;margin-top:6px;display:inline-block}
.row a.ml:hover{color:var(--acc-ink)}
.bg{font-family:var(--fm);font-size:.62rem;padding:2px 8px;border-radius:20px;font-weight:600;transform:translateY(-1px)}
.b-done{background:var(--teal-soft);color:var(--teal)}
.b-free{background:var(--surface2);color:var(--ink2)}
.b-warn{background:var(--acc-soft);color:var(--acc-ink)}
.b-opt{background:var(--surface2);color:var(--ink3)}
.jr{padding:14px 18px 18px;background:var(--surface2);border-top:1px solid var(--line)}
.jr label{font-family:var(--fm);font-size:.64rem;letter-spacing:.12em;color:var(--ink3)}
.jr textarea{width:100%;margin-top:7px;min-height:76px;resize:vertical;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:.88rem;line-height:1.65}
.jr .sv{font-family:var(--fm);font-size:.66rem;color:var(--ink3);margin-top:6px;min-height:1em}

/* map */
.mg{display:grid;gap:14px;grid-template-columns:1fr}
.mc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:9px;box-shadow:var(--sh)}
.mc svg{display:block;width:100%;height:auto;border-radius:11px;background:var(--surface2)}
.seg2{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;margin-bottom:11px}
.seg2 button{background:none;border:0;padding:6px 13px;border-radius:8px;font-size:.83rem;color:var(--ink2)}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
.mstop{cursor:pointer}
.mstop circle.hit{fill:transparent}
.mstop text.mlabel{font-family:var(--fd);font-size:13px;font-weight:400;paint-order:stroke;stroke-width:4.5px;stroke-linejoin:round}
.mstop text{font-family:var(--fm)}
.mstop circle.hit{fill:transparent}
.mstop:hover text.mlabel{font-size:14px}
.gd{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--sh)}
.gd .hd{padding:15px 17px 13px;border-bottom:1px solid var(--line)}
.gd .hd .en{font-family:var(--fm);font-size:.64rem;letter-spacing:.14em;color:var(--ink3)}
.gd .hd h3{font-size:1.18rem;margin-top:3px}
.gd .geo{font-size:.79rem;color:var(--ink2);margin-top:5px;line-height:1.55}
.drive{margin-top:10px;background:var(--acc-soft);border-radius:10px;padding:8px 11px;display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.drive .k{font-family:var(--fm);font-size:.58rem;letter-spacing:.12em;color:var(--acc-ink);flex:0 0 auto}
.drive .v{font-size:.8rem;color:var(--ink)}
.gd .dys{display:flex;gap:6px;flex-wrap:wrap;padding:12px 17px 0}
.gd .dys button{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:5px 9px;font-size:.74rem;line-height:1.3;text-align:left}
.gd .dys button:hover{border-color:var(--acc);color:var(--acc-ink)}
.gd .dys b{display:block;font-family:var(--fm);font-size:.62rem;color:var(--ink3);font-weight:600}
.gd .fx2{margin-top:12px;border-top:1px solid var(--line)}
.gd .ft{padding:12px 17px;border-bottom:1px solid var(--line)}
.gd .ft:last-child{border-bottom:0}
@media(min-width:800px){
  .gd .fx2{display:grid;grid-template-columns:1fr 1fr}
  .gd .ft{border-bottom:1px solid var(--line)}
  .gd .ft:nth-child(odd){border-right:1px solid var(--line)}
}
.gd .ft h4{margin:0;font-size:.88rem;font-weight:600;font-family:var(--fb)}
.gd .ft p{font-size:.82rem;color:var(--ink2);margin-top:2px}

/* tables & cards */
.two{display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:860px){.two{grid-template-columns:1.2fr .8fr}}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:500px;font-size:.83rem}
th,td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--fm);font-size:.63rem;letter-spacing:.1em;color:var(--ink3);font-weight:600}
tbody tr:last-child td{border-bottom:0}
td.n{font-family:var(--fm);font-variant-numeric:tabular-nums;white-space:nowrap}
td .krw{display:block;font-size:.7rem;color:var(--ink3)}
.ck{display:flex;flex-direction:column;gap:7px}
.ckr{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer}
.ckr input{margin:3px 0 0;accent-color:var(--acc);width:16px;height:16px;flex:0 0 auto}
.ckr b{font-size:.88rem;font-weight:600;display:block}
.ckr span{font-size:.78rem;color:var(--ink2)}
.ckr.on b{text-decoration:line-through;color:var(--ink3)}
.fold{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.fold>summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;align-items:center;gap:10px;font-size:.9rem;font-weight:500}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary i{margin-left:auto;font-style:normal;font-family:var(--fm);font-size:.7rem;color:var(--ink3)}
.fold>summary:hover i{color:var(--ink)}
.fold[open]>summary{border-bottom:1px solid var(--line)}
.fold[open]>summary i::before{content:'접기'}
.fold[open]>summary i{font-size:0}
.fold[open]>summary i::before{font-size:.7rem}
.fold .tw{border:0;border-radius:0}
.keys{margin-top:12px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:.82rem;color:var(--ink2)}
.keys b{color:var(--ink);font-family:var(--fm)}
.nearby{padding:15px 18px 17px;border-top:1px solid var(--line);background:var(--surface2)}
.nearby .nt{font-family:var(--fm);font-size:.64rem;letter-spacing:.12em;color:var(--ink3);margin-bottom:10px}
.nl{display:grid;gap:9px;grid-template-columns:1fr}
@media(min-width:680px){.nl{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}}
.nc{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 13px;display:flex;flex-direction:column;gap:3px}
.nh{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.nh b{font-size:.9rem;font-weight:600}
.sty{font-family:var(--fm);font-size:.6rem;padding:2px 7px;border-radius:20px;background:var(--surface2);color:var(--ink2)}
.nm2{font-family:var(--fm);font-size:.7rem;color:var(--ink3)}
.nd{font-size:.8rem;color:var(--ink2);margin-top:2px}
.nc a.ml{font-family:var(--fm);font-size:.68rem;color:var(--ink3);text-decoration:none;margin-top:3px}
.nc a.ml:hover{color:var(--acc-ink)}
.lgs{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:820px){.lgs{grid-template-columns:repeat(3,1fr)}}
.lg{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.lg .h{padding:13px 15px 11px;border-bottom:1px solid var(--line)}
.lg .h .w{font-family:var(--fm);font-size:.62rem;letter-spacing:.12em;color:var(--ink3)}
.lg .h h4{margin:3px 0 0;font-family:var(--fd);font-size:1rem;font-weight:400}
.lg .h .f{font-family:var(--fm);font-size:.72rem;color:var(--ink2);margin-top:3px}
.lg .b{padding:12px 15px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.lgr{display:flex;gap:8px;font-size:.81rem;line-height:1.5}
.lgr .m{flex:0 0 auto;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:.58rem;font-weight:700;margin-top:3px;font-family:var(--fm)}
.m.no{background:var(--acc-soft);color:var(--acc-ink)}
.m.ok{background:var(--teal-soft);color:var(--teal)}
.m.i{background:var(--surface2);color:var(--ink3)}
.lgr b{font-weight:600}.lgr span{color:var(--ink2)}
footer{border-top:1px solid var(--line);padding:16px 0 34px;color:var(--ink3);font-size:.75rem;font-family:var(--fm)}
@media(max-width:620px){.row{grid-template-columns:1fr;gap:4px}.row .tm{color:var(--ink3)}.gd{position:static}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="cabin">
  <div class="cabin-in">
    <div class="glass">
      <div class="mirror"><i></i></div>
      <div id="scene"></div>
      <div class="rim"></div>
      <div class="tagday" id="tagday"></div>
    </div>
    <div class="dash">
      <div class="dg"><div class="l">D-DAY</div><div class="v" id="dd">—</div><div class="u" id="ddu">출발까지</div></div>

      if(v)return v;

  function icon(t,g,col){
    const A=(d,f,w)=>mk('path',{d:d,fill:f||'none',stroke:f?'none':col,'stroke-width':w||1.7,'stroke-linecap':'round','stroke-linejoin':'round'},g);
    if(t==='plane')A('M -8 1 L 8 -2 M -3 -5 L 3 -3 M -3 6 L 2 4 M 8 -2 L 5 -5 M 8 -2 L 5 1',0,1.8);
    else if(t==='star'){A('M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z',col);}
    else if(t==='mtn'){A('M -9 5 L -2 -6 L 2 -1 L 5 -6 L 9 5 Z',col);A('M -2 -6 L 0.4 -2.5 L -4 -2.5 Z','#fff');}
    else if(t==='fish'){A('M -7 0 q 5 -5 11 0 q -6 5 -11 0 Z',col);A('M 4 0 L 9 -4 L 9 4 Z',col);}
    else if(t==='sauna'){A('M -7 6 L -7 -1 L 0 -6 L 7 -1 L 7 6 Z',col);A('M -3 -9 q 2 -2 0 -4 M 3 -9 q 2 -2 0 -4',0,1.5);}
    else if(t==='wine'){A('M -5 -7 L 5 -7 L 2 -1 L -2 -1 Z',col);A('M 0 -1 L 0 5 M -4 6 L 4 6',0,1.8);}
    else if(t==='raft'){A('M -8 2 q 8 5 16 0 L 7 -2 L -7 -2 Z',col);A('M 2 -3 L 7 -9',0,1.8);}
    else if(t==='boot'){A('M -4 -8 L 1 -8 L 1 0 L 7 3 L 7 7 L -4 7 Z',col);}
    else if(t==='bridge'){A('M -9 4 q 9 -11 18 0',0,2);A('M -9 4 L -9 -1 M 9 4 L 9 -1 M -9 6 L 9 6',0,1.8);}
    else if(t==='ferry'){A('M -8 3 q 8 5 16 0 L 7 0 L -7 0 Z',col);A('M -4 0 L -4 -5 L 4 -5 L 4 0',0,1.6);}
    else if(t==='wave'){A('M -9 -2 q 4.5 -5 9 0 t 9 0 M -9 4 q 4.5 -5 9 0 t 9 0',0,2);}
    else if(t==='bag'){A('M -6 -3 L 6 -3 L 7 7 L -7 7 Z',col);A('M -3 -3 q 0 -5 3 -5 t 3 5',0,1.6);}
  }
  const ICO={CHC:'plane',TKP:'star',AKI:'mtn',PUK:'fish',HWA:'sauna',BAN:'wine',ZQN:'raft',RTB:'boot',
             VS:'bridge',CQ:'ferry',BON:'wave',MAN:'fish',FM:'bag'};

  /* ── 마커 ── */
  keys.forEach(k=>{
    const st=STOPS[k],[x,y]=P(st.p),on=k===cs,spur=!!st.spur;
    const idx=order.indexOf(k);
    const g=mk('g',{class:'mstop',tabindex:'0',role:'button','aria-label':st.ko},svg);
    mk('circle',{cx:x,cy:y,r:26,class:'hit'},g);
    const r=spur?15:18;
    mk('circle',{cx:x,cy:y,r:r+(on?3:0),fill:C('--surface'),stroke:acc,'stroke-width':on?3.2:2.2,filter:'url(#mg-sh)'},g);
    const ig=mk('g',{transform:`translate(${x},${y}) scale(${spur?.82:.95})`},g);
    icon(ICO[k]||'star',ig,acc);
    if(idx>=0){
      mk('circle',{cx:x+r-2,cy:y-r+2,r:9,fill:acc,stroke:C('--surface'),'stroke-width':2},g);
      const n=mk('text',{x:x+r-2,y:y-r+6,'text-anchor':'middle','font-size':10,'font-weight':700,fill:C('--surface'),'font-family':'var(--fm)','stroke':'none'},g);
      n.textContent=idx+1;
    }
    const lb=mk('text',{x:x,y:y+r+17,'text-anchor':'middle',fill:C('--m-ink'),stroke:C('--m-sea'),class:'mlabel'},g);
    lb.textContent=st.ko;
    const go=()=>{cs=k;drawMap();drawGuide();};
    g.addEventListener('click',go);
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
  });

  /* ── 항공 표시 ── */
  const air=(x,y,ang,txt)=>{
    const g=mk('g',{transform:`translate(${x},${y})`},svg);
    const p=mk('g',{transform:`rotate(${ang}) scale(1.15)`},g);
    icon('plane',p,C('--ink3'));
    const t=mk('text',{x:0,y:24,'text-anchor':'middle','font-size':11,fill:C('--ink3'),'font-family':'var(--fm)'},g);
    t.textContent=txt;
  };
  if(nz){
    const a=P(STOPS.CHC.p);air(a[0]+74,a[1]-54,-28,'← AKL 오클랜드');
    const z=P(STOPS.ZQN.p);air(z[0]-84,z[1]+64,152,'시드니 →');
  }

  /* ── 나침반 ── */
  const cx=W-62,cy=H-66;
  mk('circle',{cx:cx,cy:cy,r:28,fill:C('--surface'),opacity:.82,stroke:C('--line2'),'stroke-width':1.4},svg);
  mk('path',{d:`M ${cx} ${cy-21} L ${cx+6} ${cy} L ${cx} ${cy+21} L ${cx-6} ${cy} Z`,fill:acc,opacity:.85},svg);
  mk('path',{d:`M ${cx-21} ${cy} L ${cx} ${cy-6} L ${cx+21} ${cy} L ${cx} ${cy+6} Z`,fill:C('--ink3'),opacity:.5},svg);
  const nt=mk('text',{x:cx,y:cy-32,'text-anchor':'middle','font-size':11,'font-weight':700,fill:C('--ink2'),'font-family':'var(--fm)'},svg);
  nt.textContent='N';

  /* ── 바다 라벨 ── */
  const sea=(x,y,t,rot)=>{const e=mk('text',{x:x,y:y,'font-size':12.5,fill:C('--m-coast'),opacity:.75,'letter-spacing':'.3em','font-family':'var(--fm)',transform:`rotate(${rot||0} ${x} ${y})`},svg);e.textContent=t;};
  if(nz){sea(52,H*.3,'TASMAN SEA',-62);sea(W-120,H*.72,'PACIFIC',70);}
  else{sea(W-150,H-80,'TASMAN SEA');}

  /* ── 축척 ── */
  const km=nz?100:5, px=km/111*sc*(nz?1:1);
  const sx=56,sy=H-40;
  mk('path',{d:`M ${sx} ${sy} L ${sx} ${sy-7} M ${sx} ${sy} L ${sx+px} ${sy} M ${sx+px} ${sy} L ${sx+px} ${sy-7}`,stroke:C('--ink3'),'stroke-width':1.6,fill:'none'},svg);
  const st2=mk('text',{x:sx+px/2,y:sy-12,'text-anchor':'middle','font-size':10,fill:C('--ink3'),'font-family':'var(--fm)'},svg);
  st2.textContent=km+'km';

  /* ── 제목 ── */
  const tg=mk('g',{},svg);
  mk('rect',{x:30,y:26,width:nz?186:166,height:40,rx:9,fill:C('--surface'),opacity:.9,stroke:C('--line2'),'stroke-width':1.2},tg);
  const t1=mk('text',{x:44,y:44,'font-size':13,fill:C('--ink'),'font-family':'var(--fd)'},tg);
  t1.textContent=nz?'뉴질랜드 남섬':'시드니';
  const t2=mk('text',{x:44,y:58,'font-size':9.5,fill:C('--ink3'),'letter-spacing':'.18em','font-family':'var(--fm)'},tg);
  t2.textContent=nz?'SOUTH ISLAND · 9 NIGHTS':'SYDNEY · 3 NIGHTS';

  /* ── 테두리 ── */
  mk('rect',{x:8,y:8,width:W-16,height:H-16,rx:14,fill:'none',stroke:C('--m-coast'),'stroke-width':2.5,opacity:.5},svg);
  mk('rect',{x:15,y:15,width:W-30,height:H-30,rx:10,fill:'none',stroke:C('--m-coast'),'stroke-width':1,opacity:.35},svg);

  host.append(svg);drawGuide();
}
function drawGuide(){
  const st=STOPS[cs],g=$('#gd');g.innerHTML='';
  const h=el('div','hd');h.append(el('div','en',st.en),el('h3',null,st.ko));
  if(GEO[cs])h.append(el('p','geo',GEO[cs]));
  g.append(h);
  if(st.dr){const dv=el('div','drive');
    dv.append(el('span','k',st.dr[0]),el('span','v',st.dr[1]));h.append(dv);}
  const ds=DAYS.map((d,i)=>({d,i})).filter(o=>o.d.spot===cs);
  if(ds.length){const r=el('div','dys');
    ds.forEach(o=>{const b=el('button');b.type='button';
      b.append(el('b',null,'DAY '+(o.i+1)+' · '+o.d.date),document.createTextNode(o.d.title));
      b.onclick=()=>{select(o.i);document.getElementById('s-day').scrollIntoView({behavior:'smooth'});};
      r.append(b);});g.append(r);}
  const fx=el('div','fx2');
  st.f.forEach(([t,p])=>{const f=el('div','ft');f.append(el('h4',null,t),el('p',null,p));fx.append(f);});
  g.append(fx);
}

/* ══ res / todo / lounge ══ */
function resPaint(){
  const tb=$('#rt');tb.innerHTML='';
  RES.forEach(([a,b,d,pay,amt,cu])=>{
    const tr=document.createElement('tr');
    tr.append(el('td',null,a),el('td','n',b));
    const td=el('td','n',d);
    if(amt&&FX[cu])td.append(el('span','krw','≈ '+won(amt*FX[cu])));
    tr.append(td);
    const ps=el('td','n');                       // 예약 완료와 결제 완료는 다르다
    ps.append(el('span','pay'+(/완료|—/.test(pay)&&!/확인/.test(pay)?' ok':' due'),pay));
    tr.append(ps);tb.append(tr);
  });
}
const ck=$('#ck');
TODO.forEach(([t,s],i)=>{
  const l=el('label','ckr'),c=document.createElement('input');c.type='checkbox';
  c.checked=!!store.get('trip.t.'+i,false);if(c.checked)l.classList.add('on');
  c.addEventListener('change',()=>{store.set('trip.t.'+i,c.checked);l.classList.toggle('on',c.checked);});
  const d=el('div');d.append(el('b',null,t),el('span',null,s));l.append(c,d);ck.append(l);
});
const lgs=$('#lgs');
LG.forEach(L=>{
  const c=el('div','lg'),h=el('div','h');
  h.append(el('div','w',L.w),el('h4',null,L.n),el('div','f',L.f));
  const b=el('div','b');
  L.r.forEach(([k,t,d])=>{const r=el('div','lgr'),m=el('span','m '+k,k==='no'?'×':k==='ok'?'✓':'·');
    const x=el('div');x.append(el('b',null,t),document.createElement('br'),el('span',null,d));
    r.append(m,x);b.append(r);});
  c.append(h,b);lgs.append(c);
});

/* ══ init ══ */
(function(){
  const T=new Date(2026,11,2),now=new Date(document.lastModified);
  const dd=Math.round((T-now)/864e5);
  $('#dd').textContent=dd>0?dd:(dd===0?'0':'—');
  $('#ddu').textContent=dd>0?'일 남음':'출발';
})();
select(0,false);drawMap();fxPaint();fxSync();

/* nav highlight */
const links=[...document.querySelectorAll('.nav a')];
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)
  links.forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+e.target.id));});},{rootMargin:'-45% 0px -50% 0px'});
document.querySelectorAll('main section').forEach(s=>io.observe(s));
</script>
